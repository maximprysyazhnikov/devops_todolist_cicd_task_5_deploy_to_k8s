name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop

env:
  DockerImageName: maxisky2595/devops-todolist-cicd-task-5

jobs:

  docker-ci:
    runs-on: ubuntu-latest

    outputs:
      image_repository: ${{ env.DockerImageName }}
      image_tag: latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.DockerImageName }}:latest

  deploy-development:
    needs: docker-ci
    uses: ./.github/workflows/deploy-to-kind.yml
    with:
      environment: development
      image_repository: ${{ needs.docker-ci.outputs.image_repository }}
      image_tag: ${{ needs.docker-ci.outputs.image_tag }}

  deploy-staging:
    needs: docker-ci
    uses: ./.github/workflows/deploy-to-kind.yml
    with:
      environment: staging
      image_repository: ${{ needs.docker-ci.outputs.image_repository }}
      image_tag: ${{ needs.docker-ci.outputs.image_tag }}
